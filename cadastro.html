<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Cadastro</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Clima tema</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="cidades.html">Cidades</a></li>
          <li class="nav-item"><a class="nav-link" href="clima.html">Climas</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="cadastro.html">Cadastro</a></li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar">
          <button class="btn btn-outline-success" type="submit">Pesquisar</button>
        </form>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <h1>Cadastro</h1>
    <p>Preencha seus dados para se cadastrar.</p>
    <form class="row g-3" onsubmit="event.preventDefault(); document.getElementById('mensagem').classList.remove('d-none'); this.reset();">
      <div class="col-md-6">
        <label for="nome" class="form-label">Nome completo</label>
        <input type="text" class="form-control" id="nome" name="nome" autocomplete="name" required>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="col-md-6">
        <label for="cidade" class="form-label">Cidade de interesse</label>
        <select class="form-select" id="cidade" name="cidade" required>
          <option value="" selected disabled>Escolha uma cidade</option>
          <option>Americana</option>
          <option>Campinas</option>
          <option>Campos do Jordão</option>
          <option>Nova Odessa</option>
          <option>Santa Bárbara d'Oeste</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Cadastrar</button>
      </div>
      <div class="col-12">
        <p id="mensagem" class="alert alert-success d-none" role="status">Cadastro realizado com sucesso!</p>
      </div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
